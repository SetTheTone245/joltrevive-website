name: Deploy to GitHub Pages

on:
  # Auto-deploy on every push to main
  push:
    branches: [main]
  # Allow manual runs from the Actions tab
  workflow_dispatch:

# Permissions required by the GitHub Pages deployment action
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; cancel superseded runs but let in-flight ones finish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Build static client
        # VITE_API_BASE_URL points the client at the Express API on Vercel so
        # bookings and repair lookups hit Postgres. It is a repository variable
        # (Settings > Secrets and variables > Actions > Variables) so the URL
        # can be switched -- e.g. to https://api.joltrevive.com once DNS is
        # cut over -- without editing code.
        # If the variable is unset, the client silently falls back to its
        # built-in static data layer and the site still works.
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: npm run build:static

      - name: Report API wiring
        run: |
          if [ -n "${{ vars.VITE_API_BASE_URL }}" ]; then
            echo "Client built against API: ${{ vars.VITE_API_BASE_URL }}"
          else
            echo "VITE_API_BASE_URL is not set - client built with the static fallback data layer."
          fi

      - name: Disable Jekyll processing
        # Stops GitHub Pages from ignoring files/folders that begin with an underscore
        run: touch dist/public/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
