<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>JoltRevive API</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0b0f14;
        color: #e6edf3;
        font: 15px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        padding: 2rem;
      }
      main { max-width: 34rem; }
      h1 { font-size: 1.25rem; margin: 0 0 .25rem; letter-spacing: -0.01em; }
      p { color: #8b98a5; margin: 0 0 1.5rem; }
      ul { list-style: none; padding: 0; margin: 0; }
      li {
        padding: .6rem .8rem;
        border: 1px solid #1e2936;
        border-radius: 8px;
        margin-bottom: .5rem;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 13px;
      }
      .m { color: #7ee787; font-weight: 600; margin-right: .6rem; }
      a { color: #58a6ff; }
    </style>
  </head>
  <body>
    <main>
      <h1>JoltRevive API</h1>
      <p>
        Backend service for
        <a href="https://www.joltrevive.com">joltrevive.com</a>. There is no user
        interface here.
      </p>
      <ul>
        <li><span class="m">GET</span>/api/health</li>
        <li><span class="m">GET</span>/api/repairs</li>
        <li><span class="m">GET</span>/api/repairs/:number</li>
        <li><span class="m">POST</span>/api/appointments</li>
        <li><span class="m">GET</span>/api/appointments/:confirmation</li>
      </ul>
    </main>
  </body>
</html>
